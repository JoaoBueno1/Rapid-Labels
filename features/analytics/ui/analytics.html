<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monthly Review — Rapid LED</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/features/stock-planning/ui/planning.css?v=20">
<link rel="stylesheet" href="/shared/rail.css?v=8">
<link rel="stylesheet" href="/shared/ui.css?v=4">
<link rel="stylesheet" href="/features/analytics/ui/analytics.css?v=3">
<script defer src="/shared/rail.js?v=9"></script>
</head>
<body>

<header class="sp-header">
  <div class="sp-header-inner">
    <span class="sp-brand"><span class="sp-logo">M</span> Monthly Review</span>
    <select id="dkMes" title="Mês do relatório"></select>
    <span class="sp-gap"></span>
    <span class="dk-key" id="dkKey"></span>
    <div class="sp-status"><span class="sp-dot fresh" id="dkDot"></span><span id="dkStatus">carregando…</span></div>
  </div>
</header>

<main class="sp-main">
  <!-- Sem abas.
       A tela anterior tinha quatro que eu inventei — "The Month", "Money
       Sitting Still", "Operations", "Release Now". O relatório de verdade tem
       33 slides numa ordem estabelecida há sete meses, e a reunião segue essa
       ordem. Uma aba é um corte novo; aqui não se corta nada. -->
  <section class="sp-view is-on">
    <div class="dk-intro" id="dkIntro"></div>
    <div id="dkBody"><div class="sp-loading">Montando o relatório…</div></div>
  </section>
</main>

<div class="sp-toast" id="toast"></div>
<script src="/features/analytics/ui/analytics.js?v=3"></script>
</body>
</html>
