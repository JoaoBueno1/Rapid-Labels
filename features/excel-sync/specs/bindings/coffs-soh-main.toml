slug = "coffs-soh-main"
title = "Coffs Harbour — SOH Main"
dataset = "stock-level"
what_it_does = "Main Warehouse + Gateway stock on hand, SUMMED, for the Coffs Harbour order templates."
feeds = ["Order Template", "weekly order tabs"]

[workbook]
file = "Coffs Harbour Aug 26.xlsx"
sheet = "SOH Main"
site_path = "TBD"

[layout]
kind = "flat"
key = "sku"
data_anchor = "B3"          # row 1 = group header, row 2 = column headers, both static
# Summed on purpose: cell I1 of the tab reads "Include gateway With Totals", and
# the order templates want Main and Gateway as one number.
locations = ["Main Warehouse", "Gateway"]

[[columns]]
field = "sku"
header = "SKU"
[[columns]]
field = "on_hand"
header = "Quantity on hand"
[[columns]]
field = "allocated"
header = "Allocated"
[[columns]]
field = "on_order"
header = "On order"
# Column F. The ONLY column any formula reads:
# =IF(ISNA(VLOOKUP(B4,'SOH Main'!B:F,5,FALSE)),0,VLOOKUP(...))  — 2,556 of them
# across 16 tabs. Its position inside B:F is load-bearing; do not reorder.
[[columns]]
field = "available"
header = "Available"

[status]
cell = "H1"

cron_utc = "0 20 * * 0-4"
sla_minutes = 1560
enabled = false
