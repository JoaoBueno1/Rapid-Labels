slug = "coffs-sales-mtd"
title = "Coffs Harbour — Sales MTD"
dataset = "monthly-sales"
what_it_does = "Coffs Harbour sales for the current month, SKU by SKU."
feeds = ["Order Template", "weekly order tabs"]

[workbook]
file = "Coffs Harbour Aug 26.xlsx"
sheet = "Sales MTD"
site_path = "TBD"

[layout]
kind = "flat"
key = "sku"
# Rows 1-4 are the Cin7 export's own metadata (period/from/to/currency), row 5 the
# branch header, row 6 the column headers. They are rewritten each run because the
# period changes with the month — unlike the SOH tabs, where the header is static.
data_anchor = "A7"
locations = ["Coffs Harbour"]

[[columns]]
field = "sku"
header = "SKU"
# Column B — the only one read: =IF(B4>0,IFNA(VLOOKUP(B4,'Sales MTD'!A:B,2,FALSE),0),0)
# 1,052 formulas across 13 tabs.
[[columns]]
field = "quantity"
header = "Quantity"
# Discount was dropped from the dataset (ambiguous aggregation, no consumer).
# The column stays so the layout matches the Cin7 export it replaces.
[[columns]]
field = "discount"
header = "Discount"
blank = true
[[columns]]
field = "total"
header = "Total"
round = 2

[status]
cell = "G1"

cron_utc = "0 20 * * 0-4"
sla_minutes = 1560
enabled = false
