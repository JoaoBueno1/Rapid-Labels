slug = "stock-level"
title = "Stock on hand by SKU x warehouse"
source = "stock_level"
source_report = "Cin7 → Reports → Inventory Products Stock Level Report"

[workbook]
file = "TBD"
sheet = "TBD"
anchor = "A1"
write_mode = "replace_range"

[layout]
kind = "pivot_2row_header"
key = "sku"
group = "location"
group_order = "alpha"
drop_empty_groups = true
preamble = false            # this report has no metadata lines

[[fixed]]
header = "SKU"
field = "sku"

[[fixed]]
header = "Unit"
field = "unit"

[[metrics]]
header = "Quantity on hand"
field = "on_hand"

[[metrics]]
header = "Allocated"
field = "allocated"

[[metrics]]
header = "On order"
field = "on_order"

[[metrics]]
header = "In transit"
field = "in_transit"

[[metrics]]
header = "Unit cost"
field = "unit_cost"
round = 6
tolerance = 0.01

# AUD VALUE, not a quantity. The mirror column is named stock_on_hand, which
# reads like a count and is documented wrongly in cin7-stock-sync/schema.sql
# ("Total across all locations"). Proven: on_hand * unit_cost == this on
# 9,877 of 9,877 blocks of the export.
[[metrics]]
header = "Stock on hand"
field = "stock_value"
round = 4
tolerance = 0.05

# Copied from Cin7, never recomputed. Cin7 derives carton-SKU availability from
# the loose parent stock, so available != on_hand - allocated on 1,666 of
# 14,971 rows — and the export shows the very same 1,666.
[[metrics]]
header = "Available"
field = "available"

[validate]
expect_rows_between = [3000, 5000]
min_groups = 10
