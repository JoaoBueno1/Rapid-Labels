<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restock All Branches</title>
  <link rel="stylesheet" href="../../styles.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link rel="manifest" href="../../manifest.json">
  <meta name="theme-color" content="#f4f6f9">
  <link rel="icon" type="image/svg+xml" href="../../icon-192.svg">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ════════════════════════════════════════════════════════════════
       Restock All Branches — Returns design (self-contained).
       Matches features/returns, container-check, replenishment-theme.
       bg #f4f6f9 · card #fff · ink #1a2230 · muted #5b6b86/#7a8aa2/#8a97ab
       border #e2e7ef/#d3dae6 · accent #0aa5e6 (hover #0893cc) · radii 7/10
       ════════════════════════════════════════════════════════════════ */
    * { box-sizing: border-box; }
    html, body {
      background: #f4f6f9 !important;
      color: #1a2230 !important;
      font-family: 'IBM Plex Sans', system-ui, sans-serif !important;
    }
    body { display: block !important; padding: 0 !important; margin: 0 !important; min-height: 100vh; }
    .mono, .num-cell, .prod-code, .send-val,
    .snapshot-badge strong, .branch-tab .tab-count {
      font-family: 'IBM Plex Mono', ui-monospace, monospace; font-feature-settings: 'tnum';
    }

    /* ── Header / footer → clean white with a light divider ── */
    .site-header { background: #fff !important; color: #1a2230 !important; border-bottom: 1px solid #e2e7ef !important; box-shadow: 0 1px 0 rgba(20,28,42,.02) !important; }
    .site-header .brand { color: #1a2230 !important; font-weight: 600 !important; opacity: 1 !important; }
    .site-header .nav-link { color: #5b6b86 !important; opacity: 1 !important; }
    .site-header .nav-link:hover { background: #eef1f6 !important; color: #0893cc !important; }
    .site-footer { background: transparent !important; color: #8a97ab !important; border-top: 1px solid #e2e7ef !important; }
    .site-footer .footer-inner { color: #8a97ab !important; }

    /* ── Full-bleed transparent container (white surfaces are the cards) ── */
    .main-container {
      max-width: 1440px !important;
      width: 100% !important;
      margin: 0 auto !important;
      padding: 18px 22px 48px !important;
      background: transparent !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      text-align: left !important;
    }
    button { cursor: pointer; }
    ::selection { background: rgba(10,165,230,.18); color: #1a2230; }

    /* ── Page hero ── */
    .rt-back { font-size: 12px; color: #5b6b86; text-decoration: none; font-weight: 500; }
    .rt-back:hover { color: #0893cc; }
    .page-title { margin: 5px 0 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; color: #1a2230; }
    .page-subtitle { margin: 3px 0 0; font-size: 12.5px; color: #8a97ab; }

    /* ── Summary bar ── */
    .summary-bar {
      display: none; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 10px 14px; background: #fff; border: 1px solid #e2e7ef;
      border-radius: 10px; font-size: 13px; color: #1a2230; margin: 10px 0;
    }
    .sum-item { display: inline-flex; align-items: center; gap: 4px; }
    .sum-item strong { font-weight: 700; }
    .sum-sep { color: #d3dae6; margin: 0 2px; }
    .sum-crit { color: #c0392b; }
    .sum-warn { color: #b46a00; }

    /* ── Branch tabs (segmented pills) ── */
    .branch-tab-bar {
      display: flex; gap: 4px; flex-wrap: wrap;
      margin: 12px 0; padding: 5px; background: #eef1f6; border-radius: 10px;
    }
    .branch-tab {
      padding: 8px 15px; border-radius: 7px; border: none; background: transparent;
      font-size: 12.5px; font-weight: 600; color: #6b7a92; cursor: pointer;
      transition: all .12s; display: flex; align-items: center; gap: 6px;
    }
    .branch-tab:hover { background: #fff; color: #1a2230; }
    .branch-tab.active { background: #0aa5e6; color: #fff; }
    .branch-tab .tab-count {
      font-size: 10px; opacity: .85; background: rgba(20,28,42,.08);
      padding: 1px 6px; border-radius: 999px;
    }
    .branch-tab.active .tab-count { background: rgba(255,255,255,.24); }

    /* ── Action bar ── */
    .action-bar { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; align-items: center; }
    .btn-action {
      padding: 8px 15px; border-radius: 7px; border: 1px solid #d3dae6; background: #fff;
      font-size: 13px; font-weight: 500; color: #1a2230; cursor: pointer;
      transition: background .12s, border-color .12s; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-action:hover { border-color: #0aa5e6; }
    .btn-action.primary { background: #0aa5e6; color: #fff; border-color: #0aa5e6; box-shadow: 0 1px 2px rgba(10,165,230,.22); }
    .btn-action.primary:hover { background: #0893cc; border-color: #0893cc; }

    /* ── Table ── */
    .table-scroll-wrapper { overflow-x: auto; border: 1px solid #e2e7ef; border-radius: 10px; background: #fff; }
    #planTable { width: 100%; font-size: 13px; border-collapse: collapse; }
    #planTable th, #planTable td { vertical-align: middle; padding: 8px 10px; white-space: nowrap; }
    #planTable th {
      text-align: center; font-size: 11px; font-weight: 600; color: #7a8aa2;
      background: #f7f9fc; border-bottom: 1px solid #e2e7ef;
      position: sticky; top: 0; z-index: 2; text-transform: uppercase; letter-spacing: .05em;
    }
    #planTable td { text-align: center; border-bottom: 1px solid #eef1f6; color: #1a2230; font-variant-numeric: tabular-nums; }
    #planTable tbody tr:hover td { background: #f9fbfd; }

    .product-cell { text-align: left !important; max-width: 280px; white-space: normal; }
    .prod-code { font-weight: 600; font-size: 12.5px; color: #1a2230; }
    .prod-name { font-size: 11px; color: #7a8aa2; line-height: 1.3; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }

    .num-cell { font-variant-numeric: tabular-nums; }
    .send-val { color: #1b8a4b; font-weight: 700; font-size: 13px; }
    .send-dim { color: #c3ccda; font-size: 11px; }
    .send-blocked { color: #c0392b; font-size: 11px; }
    .branch-label { font-size: 10px; font-weight: 600; color: #5b6b86; }
    .conflict-dot { cursor: help; font-size: 11px; }

    .alert { padding: 10px 14px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
    .alert.warning { background: #fff7e8; border: 1px solid #ffe0a6; color: #b46a00; }

    .snapshot-badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
      background: #eaf6fd; border: 1px solid #cfeafb; border-radius: 8px;
      font-size: 11.5px; color: #0893cc;
    }

    .sold-deficit-val { color: #c0392b; font-weight: 700; }
    .safety-badge { font-size: 9px; color: #c0392b; font-weight: 700; }
    .short-badge { font-size: 9px; color: #c0392b; font-weight: 700; }

    .spinner { width: 28px; height: 28px; border: 3px solid #e2e7ef; border-top-color: #0aa5e6; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="left">
        <a class="brand" href="../../index.html">Rapid LED WMS Lite</a>
      </div>
      <nav class="site-nav">
        <a href="../../index.html" class="nav-link">Home</a>
        <a href="replenishment.html" class="nav-link">Replenishment</a>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:6px">
      <div>
        <a href="replenishment.html" class="rt-back">&larr; All Branches</a>
        <h1 class="page-title">Restock All Branches</h1>
        <p class="page-subtitle">Consolidated distribution — Main stock split across all branches at once</p>
      </div>
      <div class="snapshot-badge">
        Cin7 sync: <strong id="snapshotDate">—</strong>
      </div>
    </div>

    <div id="alertContainer"></div>

    <div id="summaryBar" class="summary-bar"></div>

    <div class="action-bar">
      <button class="btn-action primary" onclick="exportExcel()">Export Excel (1 sheet/branch)</button>
      <button class="btn-action" onclick="location.reload()">Refresh</button>
    </div>

    <!-- Branch Tabs -->
    <div class="branch-tab-bar" id="branchTabs"></div>

    <!-- Table -->
    <div class="table-scroll-wrapper">
      <table id="planTable">
        <thead>
          <tr>
            <th style="text-align:left">Product</th>
            <th>Main Stock</th>
            <th>Main Safety</th>
            <th>Can Send</th>
            <th id="branchHeaders"><!-- dynamic branch columns --></th>
          </tr>
        </thead>
        <tbody id="planTableBody">
          <tr><td colspan="10" style="text-align:center;padding:40px;color:#8a97ab">Loading data...</td></tr>
        </tbody>
      </table>
    </div>

    <div id="loadingOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(244,246,249,0.85);z-index:100;align-items:center;justify-content:center">
      <div style="text-align:center">
        <div class="spinner"></div>
        <p style="margin-top:12px;color:#5b6b86;font-size:13px">Loading data...</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">&copy; 2023-2026 Rapid LED WMS Lite — All rights reserved.</div>
  </footer>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="../../supabase-config.js"></script>
  <script src="replenishment-config.js?v=20260625b"></script>
  <script src="replenishment-all.js?v=20260625b"></script>
</body>
</html>
