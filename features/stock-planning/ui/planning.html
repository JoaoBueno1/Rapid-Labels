<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Planning — Rapid LED</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="planning.css?v=21">
  <link rel="stylesheet" href="/shared/rail.css?v=8">
  <link rel="stylesheet" href="/shared/ui.css?v=4">
  <script defer src="/shared/rail.js?v=9"></script>
</head>
<body>

<header class="sp-header">
  <div class="sp-header-inner">
    <span class="sp-brand"><span class="sp-logo">S</span> Stock Planning</span>
    <nav class="sp-tabs" id="tabs">
      <button class="sp-tab is-on" data-view="overview">Overview</button>
      <button class="sp-tab" data-view="supply">Supply Planning</button>
      <button class="sp-tab" data-view="buy">Buy <span class="sp-pip" id="pipBuy"></span></button>
      <button class="sp-tab" data-view="alerts">Alerts <span class="sp-pip" id="pipAlerts"></span></button>
    </nav>
    <div class="sp-status" id="status">
      <span class="sp-dot" id="statusDot"></span><span id="statusText">Loading…</span>
    </div>
  </div>
</header>

<main class="sp-main">

<!-- ══ OVERVIEW ══════════════════════════════════════════════════════ -->
<section class="sp-view is-on" data-view="overview">
  <nav class="sp-subtabs" id="ovTabs">
    <button class="sp-subtab is-on" data-ov="health">Stock Health</button>
    <button class="sp-subtab" data-ov="risk">Coverage Risk</button>
    <button class="sp-subtab" data-ov="inbound">Inbound Pipeline</button>
    <button class="sp-subtab" data-ov="demand">Demand Book</button>
    <button class="sp-subtab" data-ov="signal">Demand Signal</button>
    <button class="sp-subtab" data-ov="dead">Dead Stock</button>
  </nav>
  <div id="ovBody"><div class="sp-loading">Loading…</div></div>
</section>


<!-- ══ SUPPLY PLANNING ═══════════════════════════════════════════════ -->
<section class="sp-view" data-view="supply">
  <div class="sp-bar">
    <select id="spSupplier"><option value="">All suppliers</option></select>
    <input type="search" id="spSearch" placeholder="Filter SKU…">
    <select id="spWeeks">
      <option value="12">12 weeks</option>
      <option value="26" selected>26 weeks</option>
      <option value="52">52 weeks</option>
    </select>
    <select id="spBack" title="Mostra o realizado das semanas anteriores, à esquerda da semana de reporte">
      <option value="0">No history</option>
      <option value="4">4 wk back</option>
      <option value="8">8 wk back</option>
      <option value="13">13 wk back</option>
      <option value="26">26 wk back</option>
    </select>
    <button class="sp-chip" id="spSort">Risk first</button>
    <button class="sp-chip" id="spRisk">At risk only</button>
    <select id="spView" title="What the list shows">
      <option value="">All products</option>
      <option value="coming">Supply coming</option>
      <option value="special">No forecast (specials)</option>
      <option value="project">Has project demand</option>
      <option value="bom">Assembled (BOM)</option>
    </select>
    <select id="spLine" title="Product line"><option value="">All lines</option></select>
    <select id="spScope" title="Who this projection is for">
      <option value="">Planning file (buy)</option>
    </select>
    <select id="spLife"><option value="">All lifecycle</option><option value="ACTIVE">Active only</option><option value="RUN_OUT">Run-out</option><option value="DISCONTINUED">Discontinued</option></select>
    <button class="sp-chip" id="spExpand">Show the working</button>
    <span class="sp-gap"></span>
    <span class="sp-count" id="spCount"></span>
  </div>
  <div class="sp-note" id="spScopeNote" hidden></div>
  <div class="sp-scroll"><table class="sp-grid sp-supply" id="spGrid"></table></div>
  <div class="sp-foot">
    <span><i class="k k-neg"></i>projected below zero</span><i></i>
    <span><i class="k k-low"></i>drops below target cover</span><i></i>
    <span><i class="k k-in"></i>PO arriving</span><i></i>
    <span><i class="k k-dr"></i>project draw</span><i></i>
    <span><i class="k" style="background:var(--xl-held);border:1px solid var(--xl-warn-ink)"></i>run-out</span><i></i>
    <span><i class="k" style="background:var(--xl-closed);border:1px solid var(--line-3)"></i>discontinued</span><i></i>
    <span>Click a cell to see where the number comes from</span>
  </div>
</section>

<!-- ══ BUY ═══════════════════════════════════════════════════════════ -->
<section class="sp-view" data-view="buy">
  <div class="sp-bar">
    <select id="byySupplier"><option value="">All suppliers</option></select>
    <button class="sp-chip" id="byyLate">Past due only</button>
    <span class="sp-gap"></span>
    <span class="sp-count" id="byyCount"></span>
    <button class="sp-btn" id="byyCopy">Copy for PO</button>
    <button class="sp-btn is-primary" id="byyCartBtn">Cart <span class="sp-pip" id="pipCart"></span></button>
  </div>
  <div id="byyBody"><div class="sp-loading">Working out what to buy…</div></div>
</section>

<!-- O carrinho. Um por fornecedor e COMPARTILHADO: o pedido de um fornecedor
     é um só, e carrinhos separados por pessoa fariam duas montarem metade do
     mesmo contêiner sem se ver. -->
<div class="sp-modal" id="cartModal">
  <div class="sp-box is-wide">
    <header><h3 id="cartTitle">Purchase cart</h3><button class="sp-btn is-ghost" data-close>&times;</button></header>
    <div class="sp-box-body" id="cartBody"></div>
    <footer id="cartFoot"></footer>
  </div>
</div>


<!-- ══ ALERTS ════════════════════════════════════════════════════════ -->
<section class="sp-view" data-view="alerts">
  <div class="sp-bar">
    <select id="alSupplier"><option value="">All suppliers</option></select>
    <select id="alCode"><option value="">All exception types</option></select>
    <button class="sp-chip is-on" data-grp="sku">By SKU</button>
    <button class="sp-chip" data-grp="supplier">By supplier</button>
    <button class="sp-chip" data-grp="flat">Every alert</button>
    <span class="sp-gap"></span>
    <button class="sp-chip" id="alCrit">Critical only</button>
    <span class="sp-count" id="alCount"></span>
  </div>
  <div id="alBody"><div class="sp-loading">Loading…</div></div>
</section>

</main>

<!-- ══ side panel ════════════════════════════════════════════════════ -->
<aside class="sp-side" id="side">
  <header><h3 id="sideTitle">Detail</h3><button class="sp-btn is-ghost" id="sideClose">&times;</button></header>
  <div class="sp-side-body" id="sideBody"></div>
</aside>



<div class="sp-toast" id="toast"></div>
<script src="/features/stock-planning/ui/sp-core.js?v=1"></script>
<script src="/features/stock-planning/ui/planning.js?v=37"></script>
</body>
</html>
